server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 45m;
  location / {
    try_files $uri $uri/ /index.html;
  }
  location /api/ {
    proxy_pass http://backend:3001;
    proxy_read_timeout 300s;
  }
  location /api-docs {
    proxy_pass http://backend:3001;
  }
  location = /health {
    proxy_pass http://backend:3001;
  }
}
